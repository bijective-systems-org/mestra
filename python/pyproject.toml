[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mestra"
version = "0.1.3"
description = "A container for simulation and surrogate data: reader, writer, validator and post-processing for the mestra format."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Bijective Systems"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["simulation", "surrogate", "surrogate-model", "hdf5", "netcdf",
            "dataset", "cfd", "fea", "cae", "mesh", "uncertainty",
            "scientific-machine-learning", "parametric-study"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: File Formats",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "h5py>=3.7",
]

[project.urls]
Homepage = "https://github.com/bijective-systems-org/mestra"
Repository = "https://github.com/bijective-systems-org/mestra"
Specification = "https://github.com/bijective-systems-org/mestra/blob/main/SPEC.md"
Guide = "https://github.com/bijective-systems-org/mestra/blob/main/docs/guide.md"
Issues = "https://github.com/bijective-systems-org/mestra/issues"

[project.optional-dependencies]
# Only the checks and the adapters need these; the package itself
# reads and writes with h5py alone.
checks = ["netCDF4>=1.6", "h5netcdf>=1.0"]
xarray = ["xarray>=2023.1"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.5"]

[project.scripts]
mestra = "mestra.cli:main"

[tool.setuptools]
packages = ["mestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "slow: builds a file too big to commit, and drives it",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = [
    # `format` and `type` are the names the specification gives these
    # attributes, and the public API uses them as written.
    "A002", "A003",
    "B905",
    # Percent formatting is the style of this repository, including
    # the corpus generator and the worked examples.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# No python_version: mypy checks under the interpreter that runs it.
# A pinned target parses every installed stub with that version's
# grammar, and numpy's stubs use the syntax of the oldest Python numpy
# itself still supports, which is newer than this package's floor.
files = ["mestra"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
